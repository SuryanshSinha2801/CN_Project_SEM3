[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "blackout-network-simulator"
version = "0.1.0"
description = "Educational adaptive network simulation for intermittent networks"
readme = "README.md"
requires-python = ">=3.14"

[tool.setuptools.packages.find]
include = ["blackout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
pretty = true

