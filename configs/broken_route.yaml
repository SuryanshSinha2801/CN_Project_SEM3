  - {node_id: C, position: {x: 460, y: 350}, communication_range: 180, buffer_capacity_bytes: 8192}
  - {node_id: D, position: {x: 1000, y: 350}, communication_range: 180, buffer_capacity_bytes: 8192}
  - {node_id: E, position: {x: 460, y: 520}, communication_range: 180, buffer_capacity_bytes: 8192}
  - {node_id: F, position: {x: 720, y: 450}, communication_range: 180, buffer_capacity_bytes: 8192}
messages:
  - {message_id: demo, source: A, destination: D, size_bytes: 1024, creation_time: 0, ttl_seconds: 15}
