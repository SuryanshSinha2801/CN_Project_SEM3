schema_version: 1
name: default-six-node-adaptive-scenario
seed: 2801
duration_seconds: 120

area:
  width: 1200
  height: 700

routing_policy: adaptive
packet_loss_probability: 0.05
ack_loss_probability: 0.02
max_link_retries: 3
ack_timeout_seconds: 1
transfer_delay_seconds: 1
spray_copy_budget: 4

adaptive_weights:
  connectivity: 0.35
  proximity: 0.35
  buffer_availability: 0.20
  node_state: 0.10
  minimum_improvement: 0.05

adaptive_contact_window_seconds: 30
adaptive_contact_saturation: 3
adaptive_edge_cooldown_seconds: 2

nodes:
  - node_id: A
    position: {x: 100, y: 350}
    communication_range: 180
    buffer_capacity_bytes: 65536
  - node_id: B
    position: {x: 280, y: 350}
    communication_range: 180
    buffer_capacity_bytes: 65536
  - node_id: C
    position: {x: 460, y: 350}
    communication_range: 180
    buffer_capacity_bytes: 65536
  - node_id: D
    position: {x: 1000, y: 350}
    communication_range: 180
    buffer_capacity_bytes: 65536
  - node_id: E
    position: {x: 460, y: 520}
    communication_range: 180
    buffer_capacity_bytes: 65536
  - node_id: F
    position: {x: 720, y: 450}
    communication_range: 180
    buffer_capacity_bytes: 65536

messages:
  - message_id: message-001
    source: A
    destination: D
    size_bytes: 4096
    creation_time: 1
    ttl_seconds: 100

forced_link_failures:
  - node_a: B
    node_b: C
    start_time: 2
    end_time: 120
